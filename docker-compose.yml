services:
  deadlock-api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - sessions-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sessions-data:
